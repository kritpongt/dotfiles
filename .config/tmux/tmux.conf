# -- Status bar
set -g renumber-windows on
set -g status-style fg=colour244,bg=colour235 #base0 and base02
setw -g window-status-style fg=colour244,bg=default #base0 and default
setw -g window-status-current-style fg=colour166,bg=default,underscore #orange and default
set -g pane-border-style fg=colour235 #base02
set -g pane-active-border-style fg=colour235 #base02
set -g message-style fg=colour136,bg=colour235 #yellow and base02
set -g display-panes-active-colour colour33 #blue
set -g display-panes-colour colour166 #orange
setw -g window-status-bell-style fg=colour235,bg=colour160 #base02, red
set -g status-left " "
setw -g window-status-current-format "#I:#W"
setw -g window-status-format "#I:#W#{?window_flags,#{s/[-*]//:window_flags}, }"
set -g status-right "#{s|^#{HOME}|~|:pane_current_path} [#S]"

# -- Initialize TPM (keep this line at the end of tmux.conf)
# run '~/.config/tmux/plugins/tpm/tpm'

# -- Step 1
# `mkdir -p ~/.config/tmux/plugins`
# `git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm`
#
# -- Step 2
# `ln -s <this_file> ~/.config/tmux/tmux.conf`
# `tmux new -s test` and then (Prefix + Shift + I)
#
# ---
# `tmux attach` 	Re-open to previous detach session
# <prefix + d> 		Detach: exit the session but keep it running in background
# <prefix + c> 		Create
# <prefix + n> 		Next window
# <prefix + p> 		Previous window
# <prefix + w> 		Watch: List of all windows and panes
# <prefix + 0-9> 	Go to a window by its number