# -- True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# -- Mouse support
set -g mouse on

# -- Pass through(escape sequences)
set -gq allow-passthrough on

# -- Sessions persistence
set -g detach-on-destroy off

# -- vim mode in tmux panes, status prompt
setw -g mode-keys vi
set -g status-key vi

set -sg escape-time 10
set -g repeat-time 600

set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features 'xterm*:extkeys'

# -- Key bindings
unbind r
bind -T prefix r command-prompt -I "#W" "rename-window '%%'"
unbind %        #vertical split
unbind v
bind v split-window -h -c "#{pane_current_path}"
unbind '"'      #horizontal split
unbind s
bind s split-window -v -c "#{pane_current_path}"
unbind [        #copy-mode
bind b copy-mode
unbind q        #display-panes
bind q if -F '#{==:#{window_panes},1}' {
	confirm-before -c q -p "kill-window? (q/n)" kill-window
} {
	kill-pane
}
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane #drag using mouse
bind -n C-S-l send-keys -H 1b 5b 31 30 38 3b 36 75 #send ctrl+shift+l to shell
bind -n S-PPage copy-mode -u
bind -n S-NPage copy-mode -d
bind -T copy-mode-vi S-PPage send-keys -X page-up
bind -T copy-mode-vi S-NPage send-keys -X page-down

